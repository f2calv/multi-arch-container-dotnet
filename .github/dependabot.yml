version: 2
updates:

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: "04:00"

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      time: "04:00"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      time: "04:00"

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      time: "04:00"
    open-pull-requests-limit: 10

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      time: "04:00"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      time: "04:00"
