# Minimal OpenTelemetry Collector used by docker-compose.yml to prove that all four sibling
# applications export the same signals. Everything received is printed to the collector's own
# stdout, so `docker compose logs -f otel-collector` is the whole demonstration.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [debug]
    traces:
      receivers: [otlp]
      exporters: [debug]
