# Builds and runs all four sibling multi-arch-container images side by side, so that
# configuration, environment variables and structured log output can be compared directly.
#
# This file lives ONLY in the .NET repository and expects the siblings to be cloned alongside it:
#
#   source/github/
#   ├── multi-arch-container-dotnet/   <- you are here
#   ├── multi-arch-container-go/
#   ├── multi-arch-container-rust/
#   └── multi-arch-container-python/
#
# Usage:
#   docker compose up --build                        # build all four in parallel, then run
#   docker compose up --build --force-recreate       # ignore cached containers
#   docker compose logs -f rust                      # follow a single service
#   docker compose down                              # stop and remove
#
# To compare OpenTelemetry output as well, start the collector profile and point the applications
# at it. Every exported log, metric and trace is printed to the collector's stdout:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 docker compose --profile telemetry up --build
#   docker compose logs -f otel-collector
#
# Compose builds services in parallel by default. Add --parallel 1 to serialise for readable output.
#
# TODO: this file is outgrowing its host repository. Four application services plus a collector is
#       orchestration, not a .NET concern, and the sibling repositories cannot use it without
#       cloning this one. Move it to a dedicated multi-arch-container-orchestrator repository that
#       owns the compose file, the collector configuration and any future dashboards, and reference
#       that repository from all four READMEs instead.
name: multi-arch-container

# ── Build provenance ──────────────────────────────────────────────────────────
# Passed as build ARGs, exactly as .github/workflows/ci.yml does, so they are baked into the
# image by the ARG/ENV block of each Dockerfile. Because they are baked at BUILD time, changing
# one requires a rebuild - `docker compose up` alone reuses the existing image, e.g.
#   GIT_COMMIT=$(git rev-parse HEAD) docker compose up --build
x-provenance: &provenance
  GIT_REPOSITORY: ${GIT_REPOSITORY:-f2calv/multi-arch-container}
  GIT_BRANCH: ${GIT_BRANCH:-refs/heads/local}
  GIT_COMMIT: ${GIT_COMMIT:-0000000000000000000000000000000000000000}
  GIT_TAG: ${GIT_TAG:-latest-dev}
  GITHUB_WORKFLOW: ${GITHUB_WORKFLOW:-docker-compose}
  GITHUB_RUN_ID: ${GITHUB_RUN_ID:-0}
  GITHUB_RUN_NUMBER: ${GITHUB_RUN_NUMBER:-0}

# ── Application configuration ─────────────────────────────────────────────────
# Passed as runtime environment variables. All four applications resolve these identically:
# the `app` section of appsettings.json, overridden by APP__<KEY> from the environment.
#
# OTEL_EXPORTER_OTLP_ENDPOINT is empty by default, which is what keeps the OpenTelemetry SDK
# uninitialised in all four applications. Setting it is the only switch required.
x-app-config: &app-config
  APP__GREETING: ${APP__GREETING:-Hello from a multi-architecture container}
  APP__INTERVAL_SECONDS: ${APP__INTERVAL_SECONDS:-3}
  APP__LOG_FORMAT: ${APP__LOG_FORMAT:-text}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment.name=compose}

services:
  # Only started by `docker compose --profile telemetry up`, so the default run stays lightweight
  # and continues to demonstrate the no-endpoint, no-SDK path.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: [telemetry]
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./.docker/otel-collector.yaml:/etc/otel-collector.yaml:ro
    restart: "no"

  dotnet:
    image: multi-arch-container-dotnet:compose
    build:
      context: .
      args: *provenance
    environment:
      <<: *app-config
      # Serilog reads its own minimum level from configuration.
      SERILOG__MINIMUMLEVEL__DEFAULT: ${LOG_LEVEL:-Information}
    restart: "no"

  go:
    image: multi-arch-container-go:compose
    build:
      context: ../multi-arch-container-go
      args: *provenance
    environment:
      <<: *app-config
      # slog reads its level from LOG_LEVEL (debug|info|warn|error).
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: "no"

  rust:
    image: multi-arch-container-rust:compose
    build:
      context: ../multi-arch-container-rust
      args: *provenance
    environment:
      <<: *app-config
      # tracing-subscriber reads its level from RUST_LOG (EnvFilter syntax).
      RUST_LOG: ${LOG_LEVEL:-info}
    restart: "no"

  python:
    image: multi-arch-container-python:compose
    build:
      context: ../multi-arch-container-python
      args: *provenance
    environment:
      <<: *app-config
      # Python logging reads its level from LOG_LEVEL (debug|info|warn|error).
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: "no"
